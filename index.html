<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Best Friend 💜</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

</head>

<body>

<div class="container">

<div id="loading" class="card">

<h1>Initializing Friendship... 💜</h1>

<div class="bar">
<div class="progress"></div>
</div>

</div>



<div id="startScreen" class="card hidden">

<h1>Hey Bestie 👀</h1>

<p>I have one important question...</p>

<button id="startBtn">Start ❤️</button>

</div>



<div id="questionScreen" class="card hidden">

<h1>Are You My Best Friend? 🥺</h1>

<p>Choose wisely 😏</p>

<div class="buttons">

<button id="yesBtn">
YES 💜
</button>

<button id="noBtn">
NO 🙄
</button>

</div>

</div>



<div id="finalScreen" class="card hidden">

<h1>Happy Best Friends Day 💜</h1>

<p id="message"></p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
